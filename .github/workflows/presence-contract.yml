name: Presence contract

on:
  push:
    branches:
      - main
      - cowork/presence
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate active story canon
        run: npm run check:canon

      - name: Validate manifest and immutable approvals
        run: npm run check:presence

      - name: Build and generate TanStack route tree
        run: npm run build:dev

      - name: Typecheck generated application
        run: npm run typecheck
